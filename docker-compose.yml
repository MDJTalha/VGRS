services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      VGRS_MODE: analysis-only
      VGRS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "127.0.0.1:8000:8000"
  web:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api
