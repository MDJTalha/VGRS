server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  location /api/ { proxy_pass http://host.docker.internal:8000/api/; proxy_set_header Host $host; }
  location /docs { proxy_pass http://host.docker.internal:8000/docs; }
  location /openapi.json { proxy_pass http://host.docker.internal:8000/openapi.json; }
}
